- name: "Another Brother (Glenthorne Road branch)"
  area: west
  lat: 51.4945
  lng: -0.2341
  coffee: 5
  wifi: 5
  sockets: false
  notes: "Perfect little spot for a quick coffee and some brunch food. It gets a bit steamy in winter and busy on the weekends (a local's favourite spot), but a solid choice to get some work done."
